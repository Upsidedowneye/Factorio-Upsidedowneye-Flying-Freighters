[mod-setting-description]
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-lock-behind-gleba=Space Age が有効なとき、carbon-fiber テクノロジーを要求し、飛行貨物船のレシピに炭素繊維を追加します。既定で有効です。
ff-lock-behind-fulgora=Space Age が有効なとき、electromagnetic plant テクノロジーを要求し、飛行貨物船のレシピにスーパーキャパシタを追加します。
ff-lock-behind-vulcanus=Space Age が有効なとき、飛行貨物船のレシピにタングステン板を追加し、ヴルカヌスの冶金にも依存させます。
ff-new-freighter-fuel=マップ設定: 新しく建設または復活した飛行貨物船は、空の燃料インベントリにこの燃料を 1 スタック事前装填します。`none` を選ぶと無燃料になります。

