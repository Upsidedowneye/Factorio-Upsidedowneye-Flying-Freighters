[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] は、列車と物流ロボットの中間にある終盤向け物流レイヤーを解放します。\n\n少なくとも 1 つの [entity=flying-freighter-station] と 1 つの [item=flying-freighter] を建設してください。ステーションは貨物・電力・ルート設定を保持し、貨物船は対応するステーション間で荷物を運びます。\n\n各ルート区間は、ステーションと貨物船の GUI で選ぶルートキーによって動作します。貨物船はまず一致する積み込み先を探し、貨物を積み込んでから、次の荷下ろし区間に一致する荷下ろし先を探します。\n\n[custom-input=ff-open-config] のショートカットか画面上の「設定」ボタンで、ステーションまたは貨物船の設定を開けます。
flying-freighter-station-setup=[entity=flying-freighter-station] は通常の大量輸送用停留所です。[font=default-bold]ステーションルート信号[/font] に、この停留所を時刻表で識別するアイテム・液体・回路信号を設定します。\n\n[font=default-bold]供給[/font] 停留所は積み込み地点です。アクティブなルート信号に一致する貨物を積み込みます。[font=default-bold]需要[/font] 停留所は荷下ろし地点です。複雑な需要要求が有効な場合、目標数に達するまで要求されたアイテムのみ受け入れます。\n\nステーション GUI では、オプションの [font=default-bold]燃料[/font]・[font=default-bold]弾薬[/font]・[font=default-bold]ゴミ[/font] のサービス役割、停留所優先度、ネットワーク ID、供給バッファ待機数、充電速度上書きも設定できます。ステーションは同じネットワーク ID の他ステーションにのみ自動接続します。\n\nステーションを回路ネットワークに接続すると、Flying Freighters のサイドパネルで符号付き供給/需要信号、優先度上書き、ネットワーク ID 上書きを読み取りつつ、蓄電量を選択した出力信号で出力できます。
flying-freighter-route-planning=[item=flying-freighter] は [font=default-bold]積み込み[/font] と [font=default-bold]荷下ろし[/font] の順序付きスケジュールを使用します。\n\n各 [font=default-bold]積み込み[/font] 区間では、訪問する停留所信号と出発に必要な最低積載率を選びます。貨物船は、十分な実貨物でインベントリを満たせるまで待機します。\n\n各 [font=default-bold]荷下ろし[/font] 区間では、目的地に対応する停留所信号を選びます。需要ステーションは単純な荷下ろし地点として振る舞うことも、一覧にある要求グループや手動要求アイテムのみを受け入れることもできます。\n\n各区間で割り込みを有効にすると、貨物船はアクティブなルートへ戻る前に、一時的に燃料補給・対応カプセル弾薬補給・ゴミ投棄へ迂回できます。長距離ルートやネットワーク間で燃料種が変わる場合に特に便利です。
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] は、Flying Freighter ステーションとバニラのパッシブ供給チェストの両方として機能するハイブリッド強化です。\n\n物流ロボットと飛行貨物船に同じ供給インベントリを共有させたいときに使います。ロボットはチェストから直接アイテムを取り出せますが、貨物船は通常のステーションと同じルート信号・電力バッファ・優先度・ネットワーク ID・サービス停留所設定を使用します。\n\nこの強化はかなり終盤向けのため、[technology=flying-freighters] と [technology=logistic-system] の後に解放され、Space Age が有効なら進行条件がさらに厳しくなります。

