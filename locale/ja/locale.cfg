ff-network-id=FF ネットワーク ID
ff-energy-mj=FF 蓄電量 (MJ)

[virtual-signal-description]
ff-supply=Flying Freighters 用の予約回路入力です。「回路信号でステーション種別を設定」が有効な場合、この信号が FF 需要 より大きいと停留所は供給になります。
ff-demand=Flying Freighters 用の予約回路入力です。「回路信号でステーション種別を設定」が有効な場合、この信号が FF 供給 より大きいと停留所は需要になります。
ff-supply-demand=停留所の役割を符号付きで制御するための標準 Flying Freighters 回路入力です。正の値は供給、負の値は需要を意味します。
ff-priority=標準 Flying Freighters 回路入力です。選択されて存在する場合、この整数値がルート選択時の保存済み停留所優先度を上書きします。
ff-network-id=標準 Flying Freighters 回路入力です。選択されて存在する場合、この整数値がルート一致時の保存済みネットワーク ID を上書きします。
ff-energy-mj=標準 Flying Freighters 回路出力です。停留所は選択されている場合、この信号に現在の蓄電量を整数メガジュールで出力します。

