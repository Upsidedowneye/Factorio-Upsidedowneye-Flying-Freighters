[virtual-signal-description]
ff-supply=Entrée de circuit réservée Flying Freighters. Lorsque le type de station via circuit est activé, l'arrêt devient Offre lorsque ce signal est supérieur à FF Demande.
ff-demand=Entrée de circuit réservée Flying Freighters. Lorsque le type de station via circuit est activé, l'arrêt devient Demande lorsque ce signal est supérieur à FF Offre.
