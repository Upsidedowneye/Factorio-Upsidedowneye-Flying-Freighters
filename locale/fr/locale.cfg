ff-network-id=Entrée de circuit Flying Freighters par défaut. Lorsqu'elle est sélectionnée et présente, cette valeur entière remplace l'identifiant de réseau enregistré de l'arrêt pour la correspondance des routes.
ff-energy-mj=Sortie de circuit Flying Freighters par défaut. Les arrêts publient leur énergie stockée actuelle sur ce signal en mégajoules entiers lorsqu'il est sélectionné.

