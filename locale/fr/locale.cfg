[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] débloque une couche logistique de fin de partie située entre les trains et les robots logistiques.\n\nConstruisez au moins une [entity=flying-freighter-station] et un [item=flying-freighter]. La station stocke la cargaison, l'énergie et les réglages de route ; le cargo transporte la marchandise entre les stations correspondantes.\n\nChaque étape de route est pilotée par une clé de route choisie dans les interfaces de la station et du cargo. Un cargo cherche d'abord un point de chargement correspondant, remplit sa cargaison, puis cherche un point de déchargement correspondant pour l'étape suivante.\n\nUtilisez le raccourci [custom-input=ff-open-config] ou le bouton Configurer à l'écran pour ouvrir les réglages de la station ou du cargo.
flying-freighter-station-setup=[entity=flying-freighter-station] est l'arrêt principal pour les gros volumes. Réglez son [font=default-bold]Signal de route de station[/font] sur l'objet, le fluide ou le signal de circuit qui identifie cet arrêt dans les horaires.\n\nLes arrêts [font=default-bold]Offre[/font] sont des points de chargement. Ils chargent la cargaison qui correspond au signal de route actif. Les arrêts [font=default-bold]Demande[/font] sont des points de déchargement. Lorsque les demandes complexes sont activées, ils n'acceptent que les objets demandés jusqu'à atteindre leurs quantités cibles.\n\nL'interface de la station gère aussi les rôles de service optionnels [font=default-bold]Carburant[/font], [font=default-bold]Munitions[/font] et [font=default-bold]Déchets[/font], ainsi que la priorité de l'arrêt, l'identifiant de réseau, le tampon d'anticipation d'offre et la surcharge du taux de charge. Les stations ne se lient automatiquement qu'aux autres stations du même identifiant de réseau.\n\nSi vous reliez la station à un réseau de circuits, le panneau latéral Flying Freighters peut lire un signal offre/demande signé, une surcharge de priorité et une surcharge d'identifiant de réseau, tout en publiant l'énergie stockée sur le signal de sortie choisi.
flying-freighter-route-planning=[item=flying-freighter] utilise un horaire ordonné d'étapes [font=default-bold]Charger[/font] et [font=default-bold]Décharger[/font].\n\nPour chaque étape [font=default-bold]Charger[/font], choisissez le signal d'arrêt à visiter et un pourcentage minimum de charge au départ. Le cargo attend qu'une cargaison réelle suffisante puisse remplir son inventaire avant de partir.\n\nPour chaque étape [font=default-bold]Décharger[/font], choisissez le signal d'arrêt correspondant pour la destination. Les stations de demande peuvent se comporter comme de simples points de déchargement ou n'accepter que les groupes de demandes et demandes manuelles listés.\n\nActivez les interruptions sur chaque étape pour permettre au cargo de faire un détour temporaire pour du carburant, des capsules de munitions prises en charge ou le déchargement des déchets avant de revenir à la route active. C'est particulièrement utile sur les longs trajets ou lorsque les types de carburant changent entre réseaux.
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] est une amélioration hybride qui agit à la fois comme station Flying Freighter et comme coffre fournisseur passif du jeu de base.\n\nUtilisez-la lorsque vous voulez que les robots logistiques et les cargos volants partagent le même inventaire fournisseur. Les robots peuvent prendre les objets directement dans le coffre, tandis que les cargos continuent d'utiliser le même signal de route, la même réserve d'énergie, la même priorité, le même identifiant de réseau et les mêmes réglages d'arrêt de service qu'une station normale.\n\nComme cette amélioration est destinée aux bases très avancées, elle se débloque après [technology=flying-freighters] et [technology=logistic-system], avec une progression plus stricte si Space Age est actif.

