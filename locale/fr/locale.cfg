[mod-setting-description]
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-lock-behind-gleba=Lorsque Space Age est actif, exige la technologie carbon-fiber et ajoute de la fibre de carbone à la recette du cargo volant. Activé par défaut.
ff-lock-behind-fulgora=Lorsque Space Age est actif, exige la technologie electromagnetic plant et ajoute des supercondensateurs à la recette du cargo volant.
ff-lock-behind-vulcanus=Lorsque Space Age est actif, ajoute des plaques de tungstène à la recette du cargo volant afin qu'il dépende aussi de la métallurgie de Vulcanus.
ff-new-freighter-fuel=Paramètre de carte : les cargos volants nouvellement construits ou réanimés préchargent une pile de ce carburant dans un inventaire de combustion autrement vide. Choisissez `none` pour laisser les nouveaux cargos sans carburant.

