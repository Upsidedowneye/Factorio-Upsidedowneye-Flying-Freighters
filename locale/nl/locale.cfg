[mod-setting-description]
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-lock-behind-gleba=Wanneer Space Age actief is, is de carbon-fiber-technologie vereist en wordt koolstofvezel aan het recept van het vliegende vrachtschip toegevoegd. Standaard ingeschakeld.
ff-lock-behind-fulgora=Wanneer Space Age actief is, is de electromagnetic plant-technologie vereist en worden supercondensatoren aan het recept van het vliegende vrachtschip toegevoegd.
ff-lock-behind-vulcanus=Wanneer Space Age actief is, worden wolfraamplaten aan het recept van het vliegende vrachtschip toegevoegd zodat het ook afhangt van de metallurgie van Vulcanus.
ff-new-freighter-fuel=Kaartinstelling: nieuw gebouwde of herstelde vliegende vrachtschepen laden één stapel van deze brandstof in een verder lege brandstofinventaris. Kies `none` om nieuwe vrachtschepen zonder brandstof te laten.

