[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] ontgrendelt een logistieke laag voor het late spel die tussen treinen en logistieke robots in zit.\n\nBouw minstens één [entity=flying-freighter-station] en één [item=flying-freighter]. Het station slaat vracht, stroom en route-instellingen op; het vrachtschip vervoert de lading tussen passende stations.\n\nElke route-etappe wordt bestuurd door een routecode die je kiest in de GUI van het station en het vrachtschip. Een vrachtschip zoekt eerst een passend laadstation, laadt vracht in en zoekt daarna een passend losstation voor de volgende los-etappe.\n\nGebruik de sneltoets [custom-input=ff-open-config] of de knop Configureren op het scherm om de instellingen van station of vrachtschip te openen.
flying-freighter-station-setup=[entity=flying-freighter-station] is de normale stop voor bulkvervoer. Stel het [font=default-bold]Stationsroutesignaal[/font] in op het item, de vloeistof of het circuitsignaal dat deze stop in dienstregelingen identificeert.\n\n[font=default-bold]Aanvoer[/font]-stops zijn laadpunten. Ze laden vracht die overeenkomt met het actieve routesignaal. [font=default-bold]Vraag[/font]-stops zijn lospunten. Wanneer complexe vraagverzoeken zijn ingeschakeld, accepteren ze alleen gevraagde items totdat hun doelhoeveelheden zijn bereikt.\n\nDe stations-GUI beheert ook optionele servicefuncties voor [font=default-bold]Brandstof[/font], [font=default-bold]Munitie[/font] en [font=default-bold]Afval[/font], plus stopprioriteit, netwerk-ID, voorpositioneringsbuffer en overschrijving van laadsnelheid. Stations koppelen alleen automatisch aan andere stations met hetzelfde netwerk-ID.\n\nAls je het station op een circuitnetwerk aansluit, kan het Flying Freighters-zijpaneeel een ondertekend aanvoer-/vraagsignaal, prioriteitsoverschrijving en netwerk-ID-overschrijving lezen, terwijl het ook opgeslagen energie op het gekozen uitgangssignaal publiceert.
flying-freighter-route-planning=[item=flying-freighter] gebruikt een geordende dienstregeling van [font=default-bold]Laden[/font]- en [font=default-bold]Lossen[/font]-etappes.\n\nVoor elke [font=default-bold]Laden[/font]-etappe kies je het stopsignaal dat bezocht moet worden en een minimum vertreklading in procenten. Het vrachtschip wacht totdat genoeg echte vracht in zijn inventaris past voordat het vertrekt.\n\nVoor elke [font=default-bold]Lossen[/font]-etappe kies je het bijbehorende stopsignaal voor de bestemming. Vraagstations kunnen zich gedragen als eenvoudige lospunten of alleen items accepteren uit vermelde verzoekgroepen en handmatige verzoeken.\n\nSchakel onderbrekingen per etappe in zodat het vrachtschip tijdelijk kan omrijden voor brandstof, ondersteunde capsulemunitie of afvaldumping voordat het terugkeert naar de actieve route. Dit is vooral nuttig op lange routes of wanneer brandstoftypen tussen netwerken wisselen.
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] is een hybride upgrade die zowel als Flying Freighter-station als als vanilla passieve aanbiederskist werkt.\n\nGebruik dit wanneer je wilt dat logistieke robots en vliegende vrachtschepen dezelfde aanbiedersvoorraad delen. Robots kunnen items direct uit de kist halen, terwijl vrachtschepen nog steeds hetzelfde routesignaal, dezelfde stroombuffer, prioriteit, netwerk-ID en servicestopinstellingen gebruiken als een normaal station.\n\nOmdat deze upgrade bedoeld is voor zeer late bases, wordt hij ontgrendeld na [technology=flying-freighters] en [technology=logistic-system], met strengere Space Age-voortgang wanneer die uitbreiding actief is.

