[mod-setting-description]
ff-lock-behind-gleba=When Space Age is active, require the carbon-fiber technology and add carbon fiber to the flying freighter recipe. Enabled by default.
ff-lock-behind-fulgora=When Space Age is active, require the electromagnetic plant technology and add supercapacitors to the flying freighter recipe.
ff-lock-behind-vulcanus=When Space Age is active, add tungsten plates to the flying freighter recipe so it also depends on Vulcanus metallurgy.
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-force-gui-hotkey-usage=Per-player setting: disable clickable Flying Freighters GUI controls whenever that same action already has a Flying Freighters hotkey on the currently open screen. Station config screens then require Q/Z/X/C/E for the matching actions, while freighter config screens use E for save/confirm.
ff-new-freighter-fuel=Map setting: newly built or revived flying freighters preload one stack of this fuel into an otherwise empty burner inventory. Choose `none` to leave new freighters unfueled.

