[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] unlocks a late-game logistics layer that sits between trains and bots.\n\nBuild at least one [entity=flying-freighter-station] and one [item=flying-freighter]. The station stores cargo, power, and route settings; the freighter carries the cargo between matching stations.\n\nEvery route leg is driven by a route key that you choose in the station and freighter GUIs. A freighter first looks for a matching pickup stop, fills cargo, then searches for a matching drop-off stop for the next unload leg.\n\nUse the [custom-input=ff-open-config] shortcut or the on-screen Configure button to open either station or freighter settings.
flying-freighter-station-setup=[entity=flying-freighter-station] is the normal bulk stop. Set its [font=default-bold]Station Route Signal[/font] to the item, fluid, or signal that identifies this stop in schedules.\n\n[font=default-bold]Supply[/font] stops are pickup points. They load cargo that matches the active route signal. [font=default-bold]Demand[/font] stops are drop-off points. For this release they currently behave like simple drop-offs; the more complex demand-request mode is still a work in progress and will be finished in a later update.\n\nThe station GUI also controls optional [font=default-bold]Fuel[/font], [font=default-bold]Ammo[/font], and [font=default-bold]Trash[/font] service roles, plus stop priority, network ID, supply-buffer staging, and charge-rate override. Stations only auto-link to other stations on the same network ID.\n\nIf you wire the station to a circuit network, the Flying Freighters side panel can read a signed supply/demand signal, priority override, and network ID override while also publishing stored energy on the selected output signal.
flying-freighter-route-planning=[item=flying-freighter] uses an ordered schedule of [font=default-bold]Load[/font] and [font=default-bold]Unload[/font] legs.\n\nFor each [font=default-bold]Load[/font] leg, choose the stop signal to visit and a minimum departure load percentage. The freighter waits until enough real cargo fits its inventory before leaving.\n\nFor each [font=default-bold]Unload[/font] leg, choose the matching stop signal for the destination. Demand stations currently behave like simple drop-offs; the more complex request-target mode is still a work in progress and will return in a later update.\n\nEnable interrupts on each leg to let the freighter temporarily detour for fuel, supported capsule ammo, or trash dumping before it returns to the active route. This is especially useful on long routes or when burner fuel types change between networks.
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] is a hybrid upgrade that acts as both a Flying Freighter station and a vanilla passive provider chest.\n\nUse it when you want logistic bots and flying freighters to share the same provider inventory. Bots can take items directly from the chest while freighters still use the same route signal, power buffer, priority, network ID, and service-stop settings as a normal station.\n\nBecause this upgrade is meant for very late-game bases, it unlocks after [technology=flying-freighters] and [technology=logistic-system], with stricter Space Age progression when that expansion is active.

