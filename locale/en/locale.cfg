[virtual-signal-description]
ff-supply=Reserved Flying Freighters circuit input. When station-type-from-circuit is enabled, the stop becomes Supply when this signal is larger than FF Demand.
ff-demand=Reserved Flying Freighters circuit input. When station-type-from-circuit is enabled, the stop becomes Demand when this signal is larger than FF Supply.
ff-supply-demand=Default Flying Freighters circuit input for signed stop-role control. Positive values mean Supply, negative values mean Demand.
ff-priority=Default Flying Freighters circuit input. When selected and present, this integer overrides the stop's saved priority for route selection.
ff-network-id=Default Flying Freighters circuit input. When selected and present, this integer overrides the stop's saved network ID for route matching.
ff-energy-mj=Default Flying Freighters circuit output. Stops publish their current stored energy on this signal in whole megajoules when it is selected.
