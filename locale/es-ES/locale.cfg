[virtual-signal-description]
ff-supply=Entrada de circuito reservada de Flying Freighters. Cuando el tipo de estación por circuito está activado, la parada pasa a ser de Suministro cuando esta señal es mayor que FF Demanda.
ff-demand=Entrada de circuito reservada de Flying Freighters. Cuando el tipo de estación por circuito está activado, la parada pasa a ser de Demanda cuando esta señal es mayor que FF Suministro.
ff-supply-demand=Entrada de circuito predeterminada de Flying Freighters para el control firmado del rol de la parada. Los valores positivos significan Suministro y los negativos significan Demanda.
ff-priority=Entrada de circuito predeterminada de Flying Freighters. Cuando está seleccionada y presente, este entero anula la prioridad guardada de la parada para la selección de rutas.
ff-network-id=Entrada de circuito predeterminada de Flying Freighters. Cuando está seleccionada y presente, este entero anula el ID de red guardado de la parada para la coincidencia de rutas.
ff-energy-mj=Salida de circuito predeterminada de Flying Freighters. Las paradas publican su energía almacenada actual en esta señal en megajulios enteros cuando está seleccionada.

