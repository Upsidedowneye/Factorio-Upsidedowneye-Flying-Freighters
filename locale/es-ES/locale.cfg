[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] desbloquea una capa logística de final de partida que se sitúa entre los trenes y los robots logísticos.\n\nConstruye al menos una [entity=flying-freighter-station] y un [item=flying-freighter]. La estación almacena carga, energía y ajustes de ruta; el carguero transporta la mercancía entre estaciones compatibles.\n\nCada tramo de ruta está controlado por una clave de ruta que eliges en las interfaces de la estación y del carguero. Un carguero primero busca una parada de recogida coincidente, carga la mercancía y después busca una parada de descarga coincidente para el siguiente tramo.\n\nUsa el atajo [custom-input=ff-open-config] o el botón Configurar en pantalla para abrir los ajustes de la estación o del carguero.
flying-freighter-station-setup=[entity=flying-freighter-station] es la parada principal para grandes volúmenes. Configura su [font=default-bold]Señal de ruta de la estación[/font] con el objeto, fluido o señal de circuito que identifique esta parada en los horarios.\n\nLas paradas de [font=default-bold]Suministro[/font] son puntos de carga. Cargan la mercancía que coincide con la señal de ruta activa. Las paradas de [font=default-bold]Demanda[/font] son puntos de descarga. Cuando las demandas complejas están activadas, solo aceptan los objetos solicitados hasta alcanzar sus cantidades objetivo.\n\nLa interfaz de la estación también controla los roles de servicio opcionales de [font=default-bold]Combustible[/font], [font=default-bold]Munición[/font] y [font=default-bold]Basura[/font], además de la prioridad de la parada, el ID de red, el búfer de preposicionamiento y la anulación de la velocidad de carga. Las estaciones solo se enlazan automáticamente con otras estaciones del mismo ID de red.\n\nSi conectas la estación a una red de circuitos, el panel lateral de Flying Freighters puede leer una señal firmada de suministro/demanda, una anulación de prioridad y una anulación de ID de red, a la vez que publica la energía almacenada en la señal de salida seleccionada.
flying-freighter-route-planning=[item=flying-freighter] usa un horario ordenado de tramos de [font=default-bold]Cargar[/font] y [font=default-bold]Descargar[/font].\n\nPara cada tramo de [font=default-bold]Cargar[/font], elige la señal de parada que debe visitar y un porcentaje mínimo de carga para salir. El carguero espera hasta que haya suficiente carga real para llenar su inventario antes de partir.\n\nPara cada tramo de [font=default-bold]Descargar[/font], elige la señal de parada correspondiente para el destino. Las estaciones de demanda pueden comportarse como simples puntos de descarga o aceptar solo grupos de solicitud y solicitudes manuales listadas.\n\nActiva interrupciones en cada tramo para permitir que el carguero se desvíe temporalmente a por combustible, munición de cápsulas compatible o vaciado de basura antes de volver a la ruta activa. Esto resulta especialmente útil en rutas largas o cuando los tipos de combustible cambian entre redes.
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] es una mejora híbrida que actúa tanto como estación de Flying Freighter como cofre proveedor pasivo del juego base.\n\nÚsala cuando quieras que los robots logísticos y los cargueros voladores compartan el mismo inventario proveedor. Los robots pueden tomar objetos directamente del cofre mientras los cargueros siguen usando la misma señal de ruta, búfer de energía, prioridad, ID de red y ajustes de parada de servicio que una estación normal.\n\nComo esta mejora está pensada para bases de juego muy avanzado, se desbloquea después de [technology=flying-freighters] y [technology=logistic-system], con una progresión más estricta de Space Age cuando esa expansión está activa.

