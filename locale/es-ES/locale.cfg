[mod-setting-description]
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-lock-behind-gleba=Cuando Space Age está activo, requiere la tecnología carbon-fiber y añade fibra de carbono a la receta del carguero volador. Activado por defecto.
ff-lock-behind-fulgora=Cuando Space Age está activo, requiere la tecnología electromagnetic plant y añade supercondensadores a la receta del carguero volador.
ff-lock-behind-vulcanus=Cuando Space Age está activo, añade placas de tungsteno a la receta del carguero volador para que también dependa de la metalurgia de Vulcanus.
ff-new-freighter-fuel=Ajuste del mapa: los cargueros voladores recién construidos o revividos precargan una pila de este combustible en un inventario de combustible que, por lo demás, estaría vacío. Elige `none` para dejar los nuevos cargueros sin combustible.

