gui_circuit_type_signal_description=Positive Werte machen den Stopp zu Angebot, negative Werte zu Nachfrage, und null oder kein Signal behält den gespeicherten Stationstyp bei.
gui_circuit_priority_signal_tooltip=Wähle das Signal, das die gespeicherte Priorität dieses Stopps überschreibt, solange es im Schaltungsnetz vorhanden ist.
