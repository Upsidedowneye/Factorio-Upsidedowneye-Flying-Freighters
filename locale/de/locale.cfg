[mod-setting-description]
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-lock-behind-gleba=Wenn Space Age aktiv ist, wird die Technologie carbon-fiber benötigt und Kohlefaser dem Rezept des fliegenden Frachters hinzugefügt. Standardmäßig aktiviert.
ff-lock-behind-fulgora=Wenn Space Age aktiv ist, wird die Technologie electromagnetic plant benötigt und dem Rezept des fliegenden Frachters werden Superkondensatoren hinzugefügt.
ff-lock-behind-vulcanus=Wenn Space Age aktiv ist, werden dem Rezept des fliegenden Frachters Wolframplatten hinzugefügt, sodass es auch von der Metallurgie auf Vulcanus abhängt.
ff-new-freighter-fuel=Karteneinstellung: neu gebaute oder wiederbelebte fliegende Frachter laden einen Stapel dieses Treibstoffs in ein ansonsten leeres Brennstoffinventar vor. Wähle `none`, um neue Frachter ohne Treibstoff zu lassen.

