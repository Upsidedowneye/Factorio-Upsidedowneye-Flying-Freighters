artist_help_join_broadcast=Dieses Mod braucht noch Grafiker. Falls jemand bessere Sprites dafür erstellen kann, postet sie bitte auf der Diskussionsseite dieses Mods im Mod-Portal, damit ich sie in das Mod einbauen kann. Das wäre eine große Hilfe. Danke!
