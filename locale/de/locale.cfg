[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] schaltet eine späte Logistikschicht frei, die zwischen Zügen und Bots liegt.\n\nBaue mindestens eine [entity=flying-freighter-station] und einen [item=flying-freighter]. Die Station speichert Fracht, Energie und Routeneinstellungen; der Frachter transportiert die Fracht zwischen passenden Stationen.\n\nJeder Routenabschnitt wird von einem Routenschlüssel gesteuert, den du in den GUIs von Station und Frachter festlegst. Ein Frachter sucht zuerst einen passenden Abholstopp, lädt Fracht und sucht dann einen passenden Entladestopp für den nächsten Entladeabschnitt.\n\nNutze das [custom-input=ff-open-config]-Kürzel oder die Schaltfläche Konfigurieren auf dem Bildschirm, um die Einstellungen von Station oder Frachter zu öffnen.
flying-freighter-station-setup=[entity=flying-freighter-station] ist der normale Massenstopp. Setze sein [font=default-bold]Stationsroutensignal[/font] auf das Item, Fluid oder Schaltungssignal, das diesen Stopp in Fahrplänen kennzeichnet.\n\n[font=default-bold]Angebot[/font]-Stopps sind Abholpunkte. Sie laden Fracht, die zum aktiven Routensignal passt. [font=default-bold]Nachfrage[/font]-Stopps sind Abladepunkte. Wenn komplexe Nachfragen aktiviert sind, akzeptieren sie nur angeforderte Items, bis ihre Zielmengen erfüllt sind.\n\nDie Stations-GUI steuert außerdem optionale [font=default-bold]Treibstoff[/font]-, [font=default-bold]Munition[/font]- und [font=default-bold]Müll[/font]-Service-Rollen sowie Stopppriorität, Netzwerk-ID, Bereitstellungspuffer und Ladegeschwindigkeits-Override. Stationen verknüpfen sich nur automatisch mit anderen Stationen derselben Netzwerk-ID.\n\nWenn du die Station mit einem Schaltungsnetzwerk verbindest, kann das Flying-Freighters-Seitenpanel ein vorzeichenbehaftetes Angebots-/Nachfragesignal, Prioritäts-Override und Netzwerk-ID-Override lesen und gleichzeitig gespeicherte Energie auf dem gewählten Ausgangssignal ausgeben.
flying-freighter-route-planning=[item=flying-freighter] verwendet einen geordneten Fahrplan aus [font=default-bold]Laden[/font]- und [font=default-bold]Entladen[/font]-Abschnitten.\n\nFür jeden [font=default-bold]Laden[/font]-Abschnitt wählst du das Stoppsignal und eine minimale Abfahrtsauslastung in Prozent. Der Frachter wartet, bis genügend echte Fracht in sein Inventar passt.\n\nFür jeden [font=default-bold]Entladen[/font]-Abschnitt wählst du das passende Stoppsignal für das Ziel. Nachfragestationen können sich wie einfache Abladepunkte verhalten oder nur gelistete Anforderungsgruppen- und manuelle Anforderungs-Items akzeptieren.\n\nAktiviere Unterbrechungen pro Abschnitt, damit der Frachter vorübergehend für Treibstoff, unterstützte Kapselmunition oder Müllentsorgung umleiten kann, bevor er zur aktiven Route zurückkehrt. Das ist besonders auf langen Routen nützlich oder wenn sich Brennstofftypen zwischen Netzwerken ändern.
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] ist ein Hybrid-Upgrade, das sowohl als Flying-Freighter-Station als auch als passive Anbietertruhe des Grundspiels fungiert.\n\nNutze sie, wenn Logistikbots und fliegende Frachter dasselbe Anbieterinventar teilen sollen. Bots können Items direkt aus der Truhe holen, während Frachter weiterhin dasselbe Routensignal, denselben Energiepuffer, dieselbe Priorität, Netzwerk-ID und dieselben Service-Stopp-Einstellungen wie eine normale Station verwenden.\n\nDa dieses Upgrade für sehr späte Basen gedacht ist, wird es nach [technology=flying-freighters] und [technology=logistic-system] freigeschaltet, mit strengerem Space-Age-Fortschritt, wenn diese Erweiterung aktiv ist.

