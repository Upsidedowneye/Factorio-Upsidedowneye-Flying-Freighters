gui_station_requests_tooltip=Nachfragestopps können die Items und Mengen auflisten, die sie auf Lager halten möchten. Hier entladende Frachter liefern nur angeforderte Items ab, solange diese Anforderungen unter ihren Zielmengen liegen.
