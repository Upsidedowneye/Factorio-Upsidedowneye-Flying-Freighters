[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] 解锁了一套介于火车与物流机器人之间的后期物流层。\n\n至少建造一个 [entity=flying-freighter-station] 和一个 [item=flying-freighter]。站点负责存储货物、电力与路线设置；货船则在匹配的站点之间运输货物。\n\n每一段路线都由你在站点与货船界面中选择的路线键驱动。货船会先寻找匹配的装货站，装满货物后，再寻找匹配的卸货站以执行下一段卸货行程。\n\n使用 [custom-input=ff-open-config] 快捷键或屏幕上的“配置”按钮来打开站点或货船设置。
flying-freighter-station-setup=[entity=flying-freighter-station] 是标准的大宗运输站。将其 [font=default-bold]站点路线信号[/font] 设置为物品、流体或电路信号，用于在时刻表中标识该站。\n\n[font=default-bold]供给[/font] 站是装货点，会装载与当前路线信号匹配的货物。[font=default-bold]需求[/font] 站是卸货点。启用复杂需求请求后，它们只会接收被请求的物品，直到目标数量被满足。\n\n站点界面还可控制可选的 [font=default-bold]燃料[/font]、[font=default-bold]弹药[/font] 与 [font=default-bold]垃圾[/font] 服务角色，以及站点优先级、网络 ID、供给缓冲预布置数量和充电速率覆盖。站点只会自动连接到相同网络 ID 的其他站点。\n\n如果将站点连接到电路网络，Flying Freighters 侧边面板可以读取带符号的供给/需求信号、优先级覆盖和网络 ID 覆盖，同时还能将存储的能量输出到选定的输出信号上。
flying-freighter-route-planning=[item=flying-freighter] 使用由 [font=default-bold]装货[/font] 与 [font=default-bold]卸货[/font] 段组成的有序时刻表。\n\n对于每个 [font=default-bold]装货[/font] 段，你需要选择要访问的站点信号以及出发所需的最小装载百分比。货船会等待，直到有足够的真实货物填满其货仓后才离开。\n\n对于每个 [font=default-bold]卸货[/font] 段，你需要选择目标站点对应的站点信号。需求站可以表现为简单卸货点，也可以只接受列出的请求组和手动请求物品。\n\n你可以在每个路段启用中断，让货船在返回当前路线前临时绕行去补充燃料、支持的胶囊弹药或倾倒垃圾。这在长距离路线或不同网络使用不同燃料时尤其有用。
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] 是一种混合升级，既可作为 Flying Freighter 站点，也可作为原版的被动供货箱。\n\n当你希望物流机器人与飞行货船共享同一个供货库存时可使用它。机器人可以直接从箱子中取货，而货船仍会使用与普通站点相同的路线信号、电力缓冲、优先级、网络 ID 与服务站设置。\n\n由于该升级面向非常后期的基地，它会在 [technology=flying-freighters] 和 [technology=logistic-system] 之后解锁；若启用了 Space Age，则解锁进度会更严格。

