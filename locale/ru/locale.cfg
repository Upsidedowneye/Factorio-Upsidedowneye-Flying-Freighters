[mod-setting-description]
ff-freighter-network-hard-mode=Startup setting: each freighter gets its own saved network ID and can only load, unload, refuel, or dump trash at stations on that same network. While enabled, a station's max stored energy and per-action energy cost both become the square of the number of freighters assigned to that station network, measured in MJ.
ff-lock-behind-gleba=Если активен Space Age, требуется технология carbon-fiber и рецепт летающего грузовика получает углеродное волокно. Включено по умолчанию.
ff-lock-behind-fulgora=Если активен Space Age, требуется технология electromagnetic plant и в рецепт летающего грузовика добавляются суперконденсаторы.
ff-lock-behind-vulcanus=Если активен Space Age, в рецепт летающего грузовика добавляются вольфрамовые пластины, чтобы он также зависел от металлургии Вулкана.
ff-new-freighter-fuel=Настройка карты: новые или восстановленные летающие грузовики загружают один стак этого топлива в пустой топливный инвентарь. Выберите `none`, чтобы оставлять новые грузовики без топлива.

