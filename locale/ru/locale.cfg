warning_reason_neither=ни топливо, ни поддерживаемые боеприпасы грузовика
warning_reason_not_ammo=неподдерживаемые боеприпасы грузовика
invalid_stop_item=Летающая станция '__1__' содержит недопустимый груз '__2__' (__3__).
empty_stop_warning=Летающая станция '__1__' имеет пустое имя уже более 5 минут.
empty_freighter_route_from=отсутствует маршрут отправления
empty_freighter_route_to=отсутствует маршрут назначения
empty_freighter_route_both=отсутствуют и маршрут отправления, и маршрут назначения
empty_freighter_route_warning=Летающий грузовик '__1__' уже более 5 минут имеет __2__.
refuel_deadlock_warning=Летающий грузовик '__1__' не может заправиться для следующего участка, потому что перевозит старое топливо (__2__), которое сейчас не предоставляет ни одна запитанная топливная станция этой сети. Следующая поездка требует __3__, но доступно только __4__, не хватает __5__. Его грузовой отсек заполнен, и нет ни одной запитанной станции мусора для сброса старого топлива.
noop_power_drain_warning=Летающая станция '__1__' потратила свой заряд действия в 100 МДж на __2__, но фактически ничего не переместилось.
