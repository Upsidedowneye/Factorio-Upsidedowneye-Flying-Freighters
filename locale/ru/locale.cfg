[tips-and-tricks-item-description]
flying-freighters-briefing=[technology=flying-freighters] открывает позднюю логистическую систему между поездами и логистическими ботами.\n\nПостройте хотя бы одну [entity=flying-freighter-station] и один [item=flying-freighter]. Станция хранит груз, энергию и настройки маршрута; грузовик перевозит груз между подходящими станциями.\n\nКаждый участок маршрута задаётся ключом маршрута, который вы выбираете в интерфейсе станции и грузовика. Сначала грузовик ищет подходящую станцию погрузки, загружает груз, затем ищет подходящую станцию выгрузки для следующего этапа.\n\nИспользуйте горячую клавишу [custom-input=ff-open-config] или кнопку «Настроить» на экране, чтобы открыть настройки станции или грузовика.
flying-freighter-station-setup=[entity=flying-freighter-station] — основная станция для массовой перевозки. Установите её [font=default-bold]сигнал маршрута станции[/font] на предмет, жидкость или сигнал схемы, который обозначает эту станцию в расписаниях.\n\nСтанции [font=default-bold]Поставка[/font] — это точки загрузки. Они загружают груз, соответствующий активному сигналу маршрута. Станции [font=default-bold]Потребность[/font] — это точки выгрузки. При включённых сложных запросах они принимают только запрошенные предметы, пока целевые количества не будут достигнуты.\n\nИнтерфейс станции также управляет дополнительными сервисными ролями [font=default-bold]Топливо[/font], [font=default-bold]Боеприпасы[/font] и [font=default-bold]Мусор[/font], а также приоритетом станции, ID сети, буфером предварительного ожидания и переопределением скорости зарядки. Станции автоматически связываются только с другими станциями с тем же ID сети.\n\nЕсли подключить станцию к сети схем, боковая панель Flying Freighters сможет считывать знаковый сигнал поставки/потребности, переопределение приоритета и ID сети, а также выводить накопленную энергию на выбранный выходной сигнал.
flying-freighter-route-planning=[item=flying-freighter] использует упорядоченное расписание участков [font=default-bold]Загрузка[/font] и [font=default-bold]Выгрузка[/font].\n\nДля каждого участка [font=default-bold]Загрузка[/font] выберите сигнал остановки и минимальный процент загрузки для отправления. Грузовик ждёт, пока реальный груз не заполнит его инвентарь в достаточной степени.\n\nДля каждого участка [font=default-bold]Выгрузка[/font] выберите соответствующий сигнал остановки для пункта назначения. Станции потребности могут вести себя как обычные точки выгрузки или принимать только предметы из указанных групп запросов и ручных запросов.\n\nВключайте прерывания на каждом участке, чтобы грузовик мог временно отклоняться за топливом, поддерживаемыми капсульными боеприпасами или для сброса мусора, а затем возвращаться на активный маршрут. Это особенно полезно на длинных маршрутах или при смене типов топлива между сетями.
flying-freighter-passive-provider-stations=[entity=flying-freighter-passive-provider-station] — это гибридное улучшение, которое работает и как станция Flying Freighter, и как обычный пассивный сундук-поставщик.\n\nИспользуйте её, если хотите, чтобы логистические боты и летающие грузовики делили один и тот же инвентарь поставщика. Боты могут брать предметы прямо из сундука, а грузовики продолжают использовать тот же сигнал маршрута, буфер энергии, приоритет, ID сети и настройки сервисных остановок, что и обычная станция.\n\nПоскольку это улучшение рассчитано на очень позднюю игру, оно открывается после [technology=flying-freighters] и [technology=logistic-system], а при включённом Space Age прогресс становится строже.

