select_config_target=Сначала выберите летающий грузовик или станцию летающего грузовика.
open_config_hotkey_conflict_warning=Внимание: Flying Freighters по умолчанию использует `Shift+F` для настроек. Если другой мод или управление уже использует `Shift+F` для поворота объектов, игроки не смогут нормально их поворачивать, пока одна из этих привязок не будет изменена.
artist_help_join_broadcast=Этому моду всё ещё нужны художники. Если кто-то может сделать для него спрайты получше, пожалуйста, выложите их на странице обсуждения этого мода на портале модов, чтобы я мог добавить их в мод. Буду очень признателен. Спасибо!
no_freighters=Не найдено ни одного летающего грузовика для настройки.
no-trash-stop=Нет доступной станции мусора для принудительной смены маршрута.
route_change_forced=Запрошена принудительная смена маршрута; грузовик сбросит груз на ближайшей станции мусора.
route_change_queued=Обновление маршрута летающего грузовика поставлено в очередь; оно применится после текущего рейса.
automated_only=Летающие грузовики работают только автоматически.
