[virtual-signal-description]
ff-supply=Зарезервированный вход схем Flying Freighters. Когда включено задание типа станции по схеме, станция становится поставкой, если этот сигнал больше FF Потребность.
ff-demand=Зарезервированный вход схем Flying Freighters. Когда включено задание типа станции по схеме, станция становится потребностью, если этот сигнал больше FF Поставка.
ff-supply-demand=Стандартный вход схем Flying Freighters для знакового управления ролью станции. Положительные значения означают поставку, отрицательные — потребность.
ff-priority=Стандартный вход схем Flying Freighters. Если выбран и присутствует, это целое число переопределяет сохранённый приоритет станции для выбора маршрута.
ff-network-id=Стандартный вход схем Flying Freighters. Если выбран и присутствует, это целое число переопределяет сохранённый ID сети станции для сопоставления маршрутов.
ff-energy-mj=Стандартный выход схем Flying Freighters. Станции выводят текущее накопленное количество энергии на этот сигнал в целых мегаджоулях, если он выбран.

