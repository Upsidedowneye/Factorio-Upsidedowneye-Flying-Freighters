gui_schedule_operation=Операция участка
gui_schedule_operation_tooltip=Загрузка посещает подходящую станцию погрузки и загружает как можно больше разных предметов. Выгрузка посещает подходящую станцию потребности и выгружает только тот груз, который эта станция сейчас запрашивает или может принять.
