gui_schedule_min_load=Минимальная загрузка для отправления (%)
gui_schedule_min_load_tooltip=Маршруты загрузки выбираются только тогда, когда планируемый груз может заполнить как минимум этот процент полезных слотов грузовика, и станции загрузки остаются состыкованными, пока не будет достигнут тот же реальный уровень заполнения. Станции выгрузки по прибытии всё равно передают столько груза, сколько могут.
